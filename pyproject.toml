[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resale-profit-tracker"
version = "1.0.0"
description = "Local-first CLI profit tracker for eBay/Amazon resellers."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Asdale Dynamics, LLC" }]
license = { text = "MIT" }

[project.scripts]
resale-tracker = "resale_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
resale_tracker = ["py.typed"]
